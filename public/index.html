<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speech Recognizer</title>
    <link href="/css/output.css" rel="stylesheet" />
  </head>
  <body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-4xl bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
      <!-- Header -->
      <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-6 text-center">
        <h1 class="text-3xl font-bold text-white tracking-tight">Audio Player</h1>
        <p class="text-blue-100 mt-2 text-sm">Real-time speech recognition</p>
      </div>

      <!-- Main Content -->
      <div class="p-8">
        <!-- Controls -->
        <div class="flex flex-wrap gap-4 justify-center mb-8">
          <button id="start" class="group relative overflow-hidden bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white px-8 py-4 rounded-xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-green-500/30">
            <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
            Start
          </button>

          <button id="stop" disabled class="group relative overflow-hidden bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 text-white px-8 py-4 rounded-xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-red-500/30 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
            <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
            Stop
          </button>

          <button id="copy" class="group relative overflow-hidden bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white px-8 py-4 rounded-xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-blue-500/30">
            <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
            Copy
          </button>

          <button id="reset" class="group relative overflow-hidden bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white px-8 py-4 rounded-xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-amber-500/30">
            <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
            Reset
          </button>
        </div>

        <!-- Text Display Area (textarea for manual editing) -->
        <div class="relative">
          <div class="absolute -inset-1 bg-gradient-to-r from-blue-400 to-purple-400 rounded-xl blur opacity-20"></div>
          <textarea
            id="data"
            placeholder='Click "Start" and begin speaking...'
            rows="1"
            class="relative w-full bg-white rounded-xl p-6 min-h-[400px] max-h-[70vh] shadow-inner border border-gray-200 text-gray-800 text-lg leading-relaxed font-medium overflow-y-auto resize-none outline-none focus:ring-4 focus:ring-blue-500/30"
          ></textarea>
        </div>

        <!-- Footer -->
        <div class="mt-6 text-center text-sm text-gray-400">
          <p>Speech recognition | <span id="lang-display">ru-RU</span></p>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50 pointer-events-none"></div>
  </body>
  <script src="/js/index.js"></script>
</html>
